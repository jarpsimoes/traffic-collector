{{- if and .Values.tempo.enabled .Values.tempo.basicAuth.enabled (not .Values.tempo.basicAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "traffic-collector.fullname" . }}-tempo-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "traffic-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tempo.basicAuth.usernameKey }}: {{ required "tempo.basicAuth.username is required when tempo.basicAuth.enabled=true and existingSecret is not set" .Values.tempo.basicAuth.username | quote }}
  {{ .Values.tempo.basicAuth.passwordKey }}: {{ required "tempo.basicAuth.password is required when tempo.basicAuth.enabled=true and existingSecret is not set" .Values.tempo.basicAuth.password | quote }}
{{- end }}