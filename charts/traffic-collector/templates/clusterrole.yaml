{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "traffic-collector.fullname" . }}
  labels:
    {{- include "traffic-collector.labels" . | nindent 4 }}
rules:
# Pod access for metadata enrichment
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Node access
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
# Namespace access
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
# ConfigMap access for configuration
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
{{- end }}
